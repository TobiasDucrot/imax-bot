name: Bot IMAX Showcase
on:
  schedule:
    - cron: '*/30 * * * *' # Se ejecuta cada 30 minutos
  workflow_dispatch: # Permite ejecutarlo manualmente con un botón

jobs:
  revisar_fechas:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Necesario para guardar el archivo de texto
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        
      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Instalar librerías
        run: pip install -r requirements.txt
        
      - name: Ejecutar el bot
        run: python script.py
        
      - name: Guardar fechas nuevas
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Actualiza lista de fechas vistas"
